<!DOCTYPE html>
<html>
  <head>
    <title>Hospital más cercano</title>
       
    <style>
      #map {
        height: 500px;
        width: 100%;
      }
      #title{
        height: 500px;
        right:1000px;
      }
    </style>
  </head>
  <body>
    <h2>Hospital más cercano desde tu ubicación</h2>
    <div id="map"></div>
    <script>
      let map, directionsService, directionsRenderer;

      function initMap() {
        directionsService = new google.maps.DirectionsService();
        directionsRenderer = new google.maps.DirectionsRenderer();

        map = new google.maps.Map(document.getElementById("map"), {
          zoom: 14,
          center: { lat: 0, lng: 0 },
        });

        directionsRenderer.setMap(map);

        // Obtiene la ubicación del usuario
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(position => {
            const userLocation = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };

            // Centra el mapa en tu ubicación
            map.setCenter(userLocation);

            // Busca hospitales cercanos
            const service = new google.maps.places.PlacesService(map);
            service.nearbySearch(
              {
                location: userLocation,
                radius: 3000,
                type: "hospital",
              },
              (results, status) => {
                if (status === google.maps.places.PlacesServiceStatus.OK) {
                  const hospital = results[0];
                  const hospitalLocation = hospital.geometry.location;

                  // Muestra marcador del hospital
                  new google.maps.Marker({
                    position: hospitalLocation,
                    map,
                    title: hospital.name,
                  });

                  // Traza la ruta
                  directionsService.route(
                    {
                      origin: userLocation,
                      destination: hospitalLocation,
                      travelMode: google.maps.TravelMode.DRIVING,
                    },
                    (response, status) => {
                      if (status === "OK") {
                        directionsRenderer.setDirections(response);
                      } else {
                        alert("No se pudo generar la ruta: " + status);
                      }
                    }
                  );
                }
              }
            );
          });
        } else {
          alert("Tu navegador no permite geolocalización.");
        }
      }
    </script>

    <!-- Carga la API de Google Maps con Places y Directions -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBqqUsryxm1rcpL9lz0ESrzP0cW_IOMOdw&libraries=places&callback=initMap"
      async
      defer
    ></script>
  </body>
</html>
