<!DOCTYPE html>
<head>
  <link rel="stylesheet" href="uwu.css">
</head>
<html>
  <head>
    <title>Hospitales Cercanos</title>
  </head>
  <body>
  <div>
      <h2>Hospitales cercanos a tu ubicación </h2>
  </div>
  <div class="map-container">
    <div id="map"></div>
  </div>
  <script>
    let map;
  
    function initMap() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userLocation = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };
  
            map = new google.maps.Map(document.getElementById("map"), {
              center: userLocation,
              zoom: 15,
            });
  
            new google.maps.Marker({
              position: userLocation,
              map,
              title: "Tu ubicación",
            });
  
            buscarHospitales(userLocation, true); // Primera búsqueda
          },
          () => {
            alert("No se pudo obtener tu ubicación.");
          }
        );
      } else {
        alert("Tu navegador no soporta geolocalización.");
      }
    }
  
    function calcularDistancia(loc1, loc2) {
      const R = 6371e3; // metros
      const φ1 = loc1.lat * Math.PI/180;
      const φ2 = loc2.lat * Math.PI/180;
      const Δφ = (loc2.lat - loc1.lat) * Math.PI/180;
      const Δλ = (loc2.lng - loc1.lng) * Math.PI/180;
  
      const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                Math.cos(φ1) * Math.cos(φ2) *
                Math.sin(Δλ/2) * Math.sin(Δλ/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  
      return R * c;
    }
  
    function buscarHospitales(userLocation, cercano = true) {
      const service = new google.maps.places.PlacesService(map);
  
      const request = {
        location: userLocation,
        ...(cercano
          ? { rankBy: google.maps.places.RankBy.DISTANCE }
          : { radius: 10000 }), // Aumentado para mejor alcance
        type: 'hospital',
      };
  
      service.nearbySearch(request, (results, status) => {
        if (status === google.maps.places.PlacesServiceStatus.OK && results.length > 0) {
          let hospitales = results.filter(place =>
            place.types.includes("hospital") &&
            place.name.toLowerCase().includes("hospital") &&
            !place.name.toLowerCase().includes("veterinaria") &&
            !place.name.toLowerCase().includes("dental") &&
            !place.name.toLowerCase().includes("consultorio") &&
            place.user_ratings_total > 5
          );
  
          // Si es la búsqueda con radio, ordenar por distancia manualmente
          if (!cercano) {
            hospitales = hospitales.map(h => {
              h.distancia = calcularDistancia(userLocation, {
                lat: h.geometry.location.lat(),
                lng: h.geometry.location.lng()
              });
              return h;
            }).sort((a, b) => a.distancia - b.distancia);
          }
  
          if (hospitales.length > 0) {
            const hospitalCercano = hospitales[0];
  
            new google.maps.Marker({
              position: hospitalCercano.geometry.location,
              map,
              title: hospitalCercano.name,
            });
  
            const directionsService = new google.maps.DirectionsService();
            const directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);
  
            const directionsRequest = {
              origin: userLocation,
              destination: hospitalCercano.geometry.location,
              travelMode: google.maps.TravelMode.DRIVING,
            };
  
            directionsService.route(directionsRequest, (result, status) => {
              if (status === google.maps.DirectionsStatus.OK) {
                directionsRenderer.setDirections(result);
              } else {
                console.error("No se pudo trazar la ruta:", status);
              }
            });
          } else if (cercano) {
            buscarHospitales(userLocation, false); // segunda búsqueda con radius
          } else {
            alert("No se encontraron hospitales cercanos.");
          }
  
        } else if (cercano) {
          buscarHospitales(userLocation, false);
        } else {
          alert("No se encontraron hospitales cercanos.");
        }
      });
    }
  </script>
  
  
  
    <script
      async
      defer
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBqqUsryxm1rcpL9lz0ESrzP0cW_IOMOdw&libraries=places&callback=initMap"
    ></script>
  </body>
</html>
